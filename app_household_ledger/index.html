var icons=["↗","↻","□","◒","◇","₩","✦","⇅"];
var detail=["Date · Amount · Category","Set once · Repeat automatically","Monthly totals · Category insights","Travel · Project · Period"];

var sel=document.getElementById("langSelect");
Object.keys(names).forEach(function(k){
  var o=document.createElement("option");o.value=k;o.textContent=names[k];sel.appendChild(o);
});

function el(tag,cls,text){var n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n;}

function render(lang){
  var c=t[lang];
  document.documentElement.lang=lang;
  sel.value=lang;
  document.getElementById("navFeatures").textContent=c.nav[2];
  document.getElementById("heroEyebrow").textContent=c.eye;

  var h1=document.getElementById("heroTitle");
  h1.textContent="";
  h1.appendChild(document.createTextNode(c.title[0]));
  h1.appendChild(document.createElement("br"));
  h1.appendChild(el("em",null,c.title[1]));
  h1.appendChild(document.createTextNode(c.title[2]));

  document.getElementById("heroDesc").textContent=c.desc;
  document.getElementById("shotMain").alt=c.screens[0];
  document.getElementById("shotMini").alt=c.screens[3];

  var trust=document.getElementById("trustRow");
  trust.textContent="";
  c.trust.slice(1).forEach(function(x){trust.appendChild(el("span",null,"✓ "+x));});

  var band=document.getElementById("flowBand");
  band.textContent="";
  c.band.forEach(function(x,i){
    var item=el("div","bandItem");
    item.appendChild(el("p",null,x));
    if(i<2)item.appendChild(el("span",null,"→"));
    band.appendChild(item);
  });

  document.getElementById("featureTitle").textContent=c.featureTitle;
  var grid=document.getElementById("featureGrid");
  grid.textContent="";
  c.features.forEach(function(f,i){
    var a=el("article",i===6?"featured":"");
    a.appendChild(el("span","featureIcon",icons[i]));
    a.appendChild(el("h3",null,f));
    a.appendChild(el("p",null,detail[i%4]));
    a.appendChild(el("i","arrow","↗"));
    grid.appendChild(a);
  });

  document.getElementById("footerText").textContent=c.footer;
  document.getElementById("footerMeta").textContent="© 2026 Surflo · "+names[lang];
}

var saved=null;
try{saved=localStorage.getItem("surflo-lang");}catch(e){}
var initial=(saved&&t[saved])?saved:"ko";
render(initial);
sel.addEventListener("change",function(){
  render(sel.value);
  try{localStorage.setItem("surflo-lang",sel.value);}catch(e){}
});
